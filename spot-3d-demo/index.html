<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="spotat.work turns Spot inspection missions into clear findings, live alarms and operator follow-ups." />
    <title>spotat.work — Spot mission intelligence</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23000'/%3E%3Cpath d='M7 2h10l5 10-5 10H7L2 12z' fill='%23ffc000'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint.
      // ?theme=light|dark in the URL wins (handy for demos and screenshots).
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark') localStorage.setItem('spot.theme', q);
        var t = localStorage.getItem('spot.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
